[pytest]
# Register custom markers so pytest doesn't warn about "unknown marks".
markers =
    reconciliation: tests that check row counts and sums reconcile between source and target
    data_quality: tests that check the loaded data meets basic quality rules (no nulls, no dupes, etc.)
    transformation: tests that check specific transformation logic (currency conversion, aggregation)

# Keep test output concise but informative.
addopts = -v --tb=short

testpaths = tests
